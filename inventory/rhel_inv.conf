# =============================================================================
# rhel_inv.conf — Central configuration for RHEL Inventory collection process
# =============================================================================
# All scripts source this file at startup.
# Edit here — changes propagate to every script automatically.
#
# HTML REPORT STYLE:
#   All web pages use style.css + app.js + a generated config.js.
#   style.css and app.js are static assets stored alongside these scripts
#   in BASE_DIR and copied to WEBDIR by rhel_inv_run.sh on every run.
#   config.js is generated fresh each run by rhel_inv_report.sh using the
#   live inventory data and the configuration arrays below.
#
#   To update what appears in the dashboard:
#     OS versions shown    → edit OS_VERSIONS below
#     Datacenter bars      → edit LOCATIONS below
#     KPI numbers          → computed automatically from the .dat file
#     Site title / org     → edit SITE_TITLE / SITE_ORG below
#     External tool links  → edit EXTERNAL_LINKS below
#
# CUTOVER COMPLETE:
#   This is the production RHEL Inventory system. The legacy process at
#   /usr/local/pnc/bin/RHEL_Inventory is decommissioned; data file names
#   no longer carry a version suffix (see migrate_v2_names.sh for the
#   one-time rename of previously suffixed data/archive files).
#
#   NOTE: BASE_DIR and WEBDIR still point at the original install paths.
#   Renaming those directories requires coordinating crontab entries, the
#   httpd document path, and the AAP job template — do as a separate,
#   planned move if desired.
# =============================================================================

# --- Base directories --------------------------------------------------------
BASE_DIR="/usr/local/pnc/bin/RHEL_Inventory_v2"
DATA_DIR="${BASE_DIR}/data"
LOGS_DIR="${BASE_DIR}/logs"
WEBDIR="${WEBDIR:-/usr/local/midweb/RHEL_v2}"

# --- Host list ---------------------------------------------------------------
# Same host list as legacy — read-only, shared safely
MASTERHOSTLIST="${MASTERHOSTLIST:-/usr/local/bin/hosts.linux.ssh.txt}"

# --- Parallel SSH (pssh) settings --------------------------------------------
PSSH_BIN="/usr/local/pssh/bin/pssh"
PSSH_BATCH=75
PSSH_TIMEOUT=90   # Increased from 30 — rhel_remote_scan.sh + RHEL_data_gather.sh
                  # combined execution can take 60-80s per host (rpm -qa, sudo checks,
                  # getent, df, lscpu run twice). 30s was cutting off RHEL_data_gather.sh
                  # before it produced any output.
PSSH_LOGIN="root"
PSSH_OPTS="-I --inline-stdout -p ${PSSH_BATCH} -t ${PSSH_TIMEOUT} -l ${PSSH_LOGIN}"

# --- Hung-process watchdog ---------------------------------------------------
WATCHDOG_WAIT=300

# --- PID / lock file ---------------------------------------------------------
PIDFILE="${PIDFILE:-${DATA_DIR}/RHEL_INV.PID}"

# --- Inventory data files ----------------------------------------------------
INVENTORYTEMP="${INVENTORYTEMP:-${DATA_DIR}/RHEL_INVENTORY.tmp}"
INVENTORYDATA="${INVENTORYDATA:-${DATA_DIR}/RHEL_INVENTORY.dat}"
INVENTDATATEXT="${INVENTDATATEXT:-RHEL_INVENTORY.txt}"
INVENTDATAHTML="${INVENTDATAHTML:-RHEL_INVENTORY.html}"
INVENTDATACSV="${INVENTDATACSV:-RHEL_INVENTORY.csv}"

# --- ID inventory files ------------------------------------------------------
IDINVENTORYTEMP="${IDINVENTORYTEMP:-${DATA_DIR}/RHEL_IDINVENTORY.tmp}"
IDINVENTORYDATA="${IDINVENTORYDATA:-${DATA_DIR}/RHEL_IDINVENTORY.dat}"

# --- DB (Oracle SID) inventory files -----------------------------------------
DBINVENTORYTEMP="${DBINVENTORYTEMP:-${DATA_DIR}/RHEL_DBINVENTORY.tmp}"
DBINVENTORYDATA="${DBINVENTORYDATA:-${DATA_DIR}/RHEL_DBINVENTORY.dat}"

# --- Package inventory files -------------------------------------------------
PACKAGETEMP="${PACKAGETEMP:-${DATA_DIR}/RHEL_PACKAGES.tmp}"
PACKAGEDATA="${PACKAGEDATA:-${DATA_DIR}/RHEL_PACKAGES.csv}"

# --- Deployment tracking file ------------------------------------------------
# Append-only, permanent record of every host's build date, with history
# going back to 2004 (originally seeded from the legacy system). This
# process is the sole writer.
DEPLOYMENTDATA="${DATA_DIR}/RHEL_DEPLOYMENTS.dat"
DEPLOYDATACSV="${DEPLOYDATACSV:-${WEBDIR}/RHEL_DEPLOYMENTS.csv}"

# --- CMDB data file ----------------------------------------------------------
CMDBDATAFILE="${CMDBDATAFILE:-$(ls /home/xaascpau/20*cmdb_ci_linux_server.csv 2>/dev/null | tail -1)}"

# --- Error log directory -----------------------------------------------------
ERRDIR="${ERRDIR:-${DATA_DIR}/errdir.$(date +%Y%m%d_%H%M)}"

# --- Log files ---------------------------------------------------------------
MAIN_LOG="${MAIN_LOG:-${LOGS_DIR}/rhel_inventory.log}"
# RUN_LOG is set by rhel_inv_run.sh at startup with a fresh timestamp —
# do not set it here or $(date) will be evaluated once at source time and
# reused for the entire session, breaking log rotation.
LATEST_LOG="${LATEST_LOG:-${LOGS_DIR}/rhel_inventory_latest.log}"

# =============================================================================
# OS versions to track — drives BOTH HTML report pages AND config.js
# =============================================================================
# This single list controls:
#   - OS version filter dropdown in inventory.html (rhel_convert_html.sh)
#   - RHEL version bar chart on index.html (via config.js rhelVersions array)
#   - Release detail table in Releases.html (rhel_inv_report.sh)
#   - Summary counts computed in rhel_inv_report.sh
#
# To add a new version: append it here, e.g. "10.0"
# To retire a version:  delete its line — it disappears from all pages
# Order determines display order in bar charts and dropdowns.
OS_VERSIONS=(
    "8.8"
    "8.10"
    "9.7"
    "9.8"
)

# OS version groupings for Releases.html display (series label : versions)
# Format: "LABEL:ver1,ver2,ver3"
# Only affects Releases.html — index.html groups by major version automatically.
OS_SERIES=(
    "RHEL 8.x Series:8.8,8.10"
    "RHEL 9.x Series:9.7,9.8"
)

# =============================================================================
# Midrange Mod Report and Server Compare Tool
# =============================================================================
# MRG CSV is archived for DAYS_TO_KEEP_MRG days in MRG_ARCHIVE_DIR.
# The archive index page is generated by rhel_inv_report.sh RPT_Midrange_Archive.
# Compare JSON files are written per-host to COMPARE_DATA_DIR for the
# Server Compare Tool — always overwritten, no archive kept.

MRGCSVDATA="${MRGCSVDATA:-${WEBDIR}/Midrange_Mod_Report.csv}"
MRGCSVTEMP="${MRGCSVTEMP:-${DATA_DIR}/Midrange_Mod_Report.csv.tmp}"
MRGJSONTMP="${MRGJSONTMP:-${DATA_DIR}/compare_data.json.tmp}"
# Note: rhel_inv_run.sh sets these with a live date before calling collect,
# so the dated names survive when rhel_inv_collect.sh re-sources this conf.
# so the file is self-documenting while it grows during pssh.
MRG_ARCHIVE_DIR="${MRG_ARCHIVE_DIR:-${WEBDIR}/Midrange_Mod/archive}"
COMPARE_DATA_DIR="${COMPARE_DATA_DIR:-/usr/local/midweb/RHEL/compare/data}"
DAYS_TO_KEEP_MRG=31

# Path to RHEL_data_gather.sh — concatenated with rhel_remote_scan.sh in pssh
# so both run in the same remote bash session with zero extra SSH connections.
RHEL_DATA_GATHER="${BASE_DIR}/RHEL_data_gather.sh"
# Controls the Datacenters bar chart on index.html.
# Order determines display order in the bar chart.
# Names must match the SHORT codes stored in the .dat file field $21
# (after expand_location() normalisation in rhel_utils.sh).
# Cloud locations (AZCE, AZE2) must also be listed in is_cloud_location()
# in rhel_utils.sh so they are classified correctly in KPI counts.
#
# To add a new datacenter: append it here AND add it to expand_location()
# and is_cloud_location() (if cloud) in rhel_utils.sh.
LOCATIONS=(
    "GF0"
    "GF1"
    "GF2"
    "AZCE"
    "AZE2"
)

# =============================================================================
# Site branding — written into config.js each run
# =============================================================================
SITE_TITLE="RHEL Operations"
SITE_SUBTITLE="Inventory & Deployment"
SITE_ORG="OS Engineering · PNC"

# Footer text — appears at the bottom of every generated HTML page.
# Change these without touching any script.
SITE_FOOTER_COMPANY="PNC"
SITE_FOOTER_ORG="IaaS - Data Center Infrastructure - Linux Engineering"

# External tool links shown in the sidebar on every page.
# Format: "Label|href"  (pipe-separated, no spaces around pipe)
EXTERNAL_LINKS=(
    "RHEL 8 to 9 Upgrade Eligibility|#upgrade-readiness"
    "Server Compare Tool|#server-compare"
    "Compare Data Tool|#compare-data"
    "Data Migration|#data-migration"
    "RHEL Patchset Overview|#patchset-overview"
)

# =============================================================================
# Location codes (referenced by rhel_utils.sh expand_location / is_cloud_location)
# =============================================================================
# Locations are stored as SHORT codes only: GF0, GF1, GF2, AZCE, AZE2 etc.
# Legacy values like "Greenfield-GF0" are normalised by expand_location().
# Cloud locations (AZCE, AZE2) are classified as Cloud servers in KPI counts.
# Add new datacenters to expand_location() and is_cloud_location() in
# rhel_utils.sh when they come online, and to LOCATIONS above.

# --- Package inventory control -----------------------------------------------
# RUN_PACKAGES_ON_MAIN: set to 1 to run package inventory as part of the main
# nightly run on the primary jumpbox. Set to 0 to keep it on the secondary
# jumpbox only (legacy behavior). Default 1 — single jumpbox operation.
# If the main run takes too long with packages enabled, set back to 0 and
# add rhel_pkginventory.sh to the secondary jumpbox cron separately.
RUN_PACKAGES_ON_MAIN="${RUN_PACKAGES_ON_MAIN:-1}"

# --- Inventory delta check ---------------------------------------------------
# Warn if the inventory host count drops by more than this percentage vs the
# prior run. Catches partial scan failures before bad data gets promoted.
# Set to 0 to disable. Recommended range: 3–10.
INV_DELTA_WARN_PCT=5

# --- Retention ---------------------------------------------------------------
ROTATE_INVENTORY=3
ROTATE_INVENTORY_CSV=14
ROTATE_PACKAGES=10
ROTATE_IDINVENTORY=3
ROTATE_DBINVENTORY=3
ERRDIR_RETAIN_DAYS=7

# --- Report data files -------------------------------------------------------
APPDATAPLAT="${APPDATAPLAT:-${DATA_DIR}/check_RHEL_versions_MNEMONIC_PLATFORM.dat}"
APPDATAREL="${APPDATAREL:-${DATA_DIR}/check_RHEL_versions_MNEMONIC_RELEASES.dat}"
LOCDATAPLAT="${LOCDATAPLAT:-${DATA_DIR}/check_RHEL_versions_LOCATION_PLATFORM.dat}"
LOCDATAREL="${LOCDATAREL:-${DATA_DIR}/check_RHEL_versions_LOCATION_RELEASES.dat}"
LOSTLIST="${LOSTLIST:-RHEL_nonresponsive.txt}"
HISTFILE="${DATA_DIR}/RHEL_Inventory_History.dat"
HISTFILETEXT="RHEL_Inventory_History.txt"

# --- RHEL 8 -> 9 Upgrade data --------------------------------------------------
UPGRADE_REQUEST_URL="https://your-jira/create-upgrade-request"
UPGRADE_DOCS_URL="https://confluence.pnc.com/rhel9-upgrade-docs"
UPGRADE_FAQ_URL="https://confluence.pnc.com/rhel9-upgrade-faq"
UPGRADE_DISK_REQUEST_URL="https://your-jira/create-disk-expansion-request"