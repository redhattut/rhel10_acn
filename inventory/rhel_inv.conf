# =============================================================================
# rhel_inv.conf — Central configuration for RHEL Inventory collection process
# =============================================================================
# All scripts source this file at startup.
# Edit here — changes propagate to every script automatically.
#
# HTML REPORT STYLE (v2):
#   All web pages use style.css + app.js + a generated config.js.
#   style.css and app.js are static assets stored alongside these scripts
#   in BASE_DIR and copied to WEBDIR by rhel_inv_run.sh on every run.
#   config.js is generated fresh each run by rhel_inv_report.sh using the
#   live inventory data and the configuration arrays below.
#
#   To update what appears in the dashboard:
#     OS versions shown    → edit OS_VERSIONS below
#     Datacenter bars      → edit LOCATIONS below
#     KPI numbers          → computed automatically from the .dat file
#     Site title / org     → edit SITE_TITLE / SITE_ORG below
#     External tool links  → edit EXTERNAL_LINKS below
#
# PARALLEL OPERATION WITH LEGACY:
#   This config uses BASE_DIR=/usr/local/pnc/bin/RHEL_Inventory_v2
#   The legacy process lives at /usr/local/pnc/bin/RHEL_Inventory
#   All output files use different names so both can run simultaneously
#   without any file collisions.
#
#   Once validated and cutover is complete:
#     1. Update BASE_DIR to /usr/local/pnc/bin/RHEL_Inventory
#     2. Update INVENTORYDATA, PACKAGEDATA etc. back to original names
#     3. Update crontab entries
#     4. Decommission legacy scripts
# =============================================================================

# --- Base directories --------------------------------------------------------
# v2 runs from its own directory — no overlap with legacy process
BASE_DIR="/usr/local/pnc/bin/RHEL_Inventory_v2"
DATA_DIR="${BASE_DIR}/data"
LOGS_DIR="${BASE_DIR}/logs"
WEBDIR="${WEBDIR:-/usr/local/midweb/RHEL_v2}"

# --- Host list ---------------------------------------------------------------
# Same host list as legacy — read-only, shared safely
MASTERHOSTLIST="${MASTERHOSTLIST:-/usr/local/bin/hosts.linux.ssh.txt}"

# --- Parallel SSH (pssh) settings --------------------------------------------
PSSH_BIN="/usr/local/pssh/bin/pssh"
PSSH_BATCH=75
PSSH_TIMEOUT=30
PSSH_LOGIN="root"
PSSH_OPTS="-I --inline-stdout -p ${PSSH_BATCH} -t ${PSSH_TIMEOUT} -l ${PSSH_LOGIN}"

# --- Hung-process watchdog ---------------------------------------------------
WATCHDOG_WAIT=300

# --- PID / lock file ---------------------------------------------------------
PIDFILE="${PIDFILE:-${DATA_DIR}/RHEL_INV_V2.PID}"

# --- Inventory data files ----------------------------------------------------
# Named with _v2 suffix during parallel operation to avoid legacy collisions.
# After cutover: remove _v2 suffix and update WEBDIR above.
INVENTORYTEMP="${INVENTORYTEMP:-${DATA_DIR}/RHEL_INVENTORY_v2.tmp}"
INVENTORYDATA="${INVENTORYDATA:-${DATA_DIR}/RHEL_INVENTORY_v2.dat}"
INVENTDATATEXT="${INVENTDATATEXT:-RHEL_INVENTORY_v2.txt}"
INVENTDATAHTML="${INVENTDATAHTML:-RHEL_INVENTORY_v2.html}"
INVENTDATACSV="${INVENTDATACSV:-RHEL_INVENTORY_v2.csv}"

# --- ID inventory files ------------------------------------------------------
IDINVENTORYTEMP="${IDINVENTORYTEMP:-${DATA_DIR}/RHEL_IDINVENTORY_v2.tmp}"
IDINVENTORYDATA="${IDINVENTORYDATA:-${DATA_DIR}/RHEL_IDINVENTORY_v2.dat}"

# --- DB (Oracle SID) inventory files -----------------------------------------
DBINVENTORYTEMP="${DBINVENTORYTEMP:-${DATA_DIR}/RHEL_DBINVENTORY_v2.tmp}"
DBINVENTORYDATA="${DBINVENTORYDATA:-${DATA_DIR}/RHEL_DBINVENTORY_v2.dat}"

# --- Package inventory files -------------------------------------------------
PACKAGETEMP="${PACKAGETEMP:-${DATA_DIR}/RHEL_PACKAGES_v2.tmp}"
PACKAGEDATA="${PACKAGEDATA:-${DATA_DIR}/RHEL_PACKAGES_v2.csv}"

# --- Deployment tracking file ------------------------------------------------
# v2 maintains its own copy of RHEL_DEPLOYMENTS.dat under DATA_DIR.
#
# INITIAL SETUP (one-time, before first run):
#   cp /usr/local/pnc/bin/RHEL_Inventory/data/RHEL_DEPLOYMENTS.dat \
#      /usr/local/pnc/bin/RHEL_Inventory_v2/data/RHEL_DEPLOYMENTS.dat
#
# This preserves the full history going back to 2004. After cutover, v2
# is the sole writer and the legacy copy is no longer updated.
# See README.md cutover checklist for full steps.
DEPLOYMENTDATA="${DATA_DIR}/RHEL_DEPLOYMENTS.dat"
DEPLOYDATACSV="${DEPLOYDATACSV:-${WEBDIR}/RHEL_DEPLOYMENTS_v2.csv}"

# --- CMDB data file ----------------------------------------------------------
CMDBDATAFILE="${CMDBDATAFILE:-$(ls /home/xaascpau/20*cmdb_ci_linux_server.csv 2>/dev/null | tail -1)}"

# --- Error log directory -----------------------------------------------------
ERRDIR="${ERRDIR:-${DATA_DIR}/errdir.$(date +%Y%m%d_%H%M)}"

# --- Log files ---------------------------------------------------------------
MAIN_LOG="${MAIN_LOG:-${LOGS_DIR}/rhel_inventory_v2.log}"
RUN_LOG="${RUN_LOG:-${LOGS_DIR}/rhel_inventory_v2_run.$(date +%Y%m%d).log}"
LATEST_LOG="${LATEST_LOG:-${LOGS_DIR}/rhel_inventory_v2_latest.log}"

# =============================================================================
# OS versions to track — drives BOTH HTML report pages AND config.js
# =============================================================================
# This single list controls:
#   - OS version filter dropdown in inventory.html (rhel_convert_html.sh)
#   - RHEL version bar chart on index.html (via config.js rhelVersions array)
#   - Release detail table in Releases.html (rhel_inv_report.sh)
#   - Summary counts computed in rhel_inv_report.sh
#
# To add a new version: append it here, e.g. "10.0"
# To retire a version:  delete its line — it disappears from all pages
# Order determines display order in bar charts and dropdowns.
OS_VERSIONS=(
    "8.8"
    "8.10"
    "9.6"
    "9.7"
    "9.8"
)

# OS version groupings for Releases.html display (series label : versions)
# Format: "LABEL:ver1,ver2,ver3"
# Only affects Releases.html — index.html groups by major version automatically.
OS_SERIES=(
    "RHEL 8.x Series:8.8,8.10"
    "RHEL 9.x Series:9.6,9.7,9.8"
)

# =============================================================================
# Datacenter locations — drives config.js locations array
# =============================================================================
# Controls the Datacenters bar chart on index.html.
# Order determines display order in the bar chart.
# Names must match the SHORT codes stored in the .dat file field $21
# (after expand_location() normalisation in rhel_utils.sh).
# Cloud locations (AZCE, AZE2) must also be listed in is_cloud_location()
# in rhel_utils.sh so they are classified correctly in KPI counts.
#
# To add a new datacenter: append it here AND add it to expand_location()
# and is_cloud_location() (if cloud) in rhel_utils.sh.
LOCATIONS=(
    "GF0"
    "GF1"
    "GF2"
    "AZCE"
    "AZE2"
)

# =============================================================================
# Site branding — written into config.js each run
# =============================================================================
SITE_TITLE="RHEL Operations"
SITE_SUBTITLE="Inventory & Deployment"
SITE_ORG="OS Engineering · PNC"

# External tool links shown in the sidebar on every page.
# Format: "Label|href"  (pipe-separated, no spaces around pipe)
EXTERNAL_LINKS=(
    "RHEL Upgrade Readiness|#upgrade-readiness"
    "Data Migration|#data-migration"
    "RHEL Patchset Overview|#patchset-overview"
)

# =============================================================================
# Location codes (referenced by rhel_utils.sh expand_location / is_cloud_location)
# =============================================================================
# Locations are stored as SHORT codes only: GF0, GF1, GF2, AZCE, AZE2 etc.
# Legacy values like "Greenfield-GF0" are normalised by expand_location().
# Cloud locations (AZCE, AZE2) are classified as Cloud servers in KPI counts.
# Add new datacenters to expand_location() and is_cloud_location() in
# rhel_utils.sh when they come online, and to LOCATIONS above.

# --- Package inventory control -----------------------------------------------
# RUN_PACKAGES_ON_MAIN: set to 1 to run package inventory as part of the main
# nightly run on the primary jumpbox. Set to 0 to keep it on the secondary
# jumpbox only (legacy behavior). Default 1 — single jumpbox operation.
# If the main run takes too long with packages enabled, set back to 0 and
# add rhel_pkginventory.sh to the secondary jumpbox cron separately.
RUN_PACKAGES_ON_MAIN="${RUN_PACKAGES_ON_MAIN:-1}"

# --- Inventory delta check ---------------------------------------------------
# Warn if the inventory host count drops by more than this percentage vs the
# prior run. Catches partial scan failures before bad data gets promoted.
# Set to 0 to disable. Recommended range: 3–10.
INV_DELTA_WARN_PCT=5

# --- Retention ---------------------------------------------------------------
ROTATE_INVENTORY=3
ROTATE_INVENTORY_CSV=14
ROTATE_PACKAGES=10
ROTATE_IDINVENTORY=3
ROTATE_DBINVENTORY=3
ERRDIR_RETAIN_DAYS=7

# --- Report data files -------------------------------------------------------
APPDATAPLAT="${APPDATAPLAT:-${DATA_DIR}/check_RHEL_versions_MNEMONIC_PLATFORM_v2.dat}"
APPDATAREL="${APPDATAREL:-${DATA_DIR}/check_RHEL_versions_MNEMONIC_RELEASES_v2.dat}"
LOCDATAPLAT="${LOCDATAPLAT:-${DATA_DIR}/check_RHEL_versions_LOCATION_PLATFORM_v2.dat}"
LOCDATAREL="${LOCDATAREL:-${DATA_DIR}/check_RHEL_versions_LOCATION_RELEASES_v2.dat}"
LOSTLIST="${LOSTLIST:-RHEL_nonresponsive_v2.txt}"
HISTFILE="${DATA_DIR}/RHEL_Inventory_History_v2.dat"
HISTFILETEXT="RHEL_Inventory_History_v2.txt"
