---
# Orchestration only - logic lives in the individual task files below.
#
# mrg_dual_auth_lifecycle_action (vars/main.yml, default "configure") is the
# primary control - it's a plain extra_var, which is what AAP Survey
# questions actually produce (Surveys always become extra_vars, never the
# Job Template's native "Job Tags" field - see README.md). Set it via:
#   - an AAP Survey multiple-choice question (recommended - see README), or
#   - -e mrg_dual_auth_lifecycle_action=rejoin on the CLI
#
# Tags are also attached below purely as a CLI convenience for ad-hoc
# `--tags configure` / `--tags join` partial reruns - they are NOT required
# to trigger rejoin/leave_ad; the `when:` conditions on
# mrg_dual_auth_lifecycle_action are what actually gate those.
#
# IMPORTANT: configure_auth.yml is tagged both `configure` AND `join`,
# deliberately. Joining AD is meaningless without the sssd/krb5/conf.d
# config configure_auth.yml lays down first (it's what makes the
# [domain/OUD] coexistence config exist at all) - so `--tags join` alone
# must still apply configure_auth.yml, not skip straight to the join
# itself. The reverse isn't true: `--tags configure` alone does NOT also
# run join_ad.yml, since reapplying config shouldn't automatically also
# attempt a domain join.
#
# Allowed mrg_dual_auth_lifecycle_action values:
#   configure  (default) -> facts + preflight + health check + configure + join-if-needed
#   rejoin                -> facts + preflight + health check + configure, then forced
#                            leave-then-rejoin (rejoin.yml does its own join_ad.yml import -
#                            the standalone join task above is skipped to avoid joining
#                            twice in the same run)
#   leave_ad               -> facts + preflight + health check, then full decommission only
#                            (configure/join are both skipped - there's no reason to
#                            reapply config or attempt a fresh join right before tearing
#                            it back down again)

- name: Gather environment facts (mrg_dual_auth_target_env, domain, realm, RHEL major, OU)
  ansible.builtin.import_tasks: facts.yml
  tags: always

- name: Run pre-flight validation checks
  ansible.builtin.import_tasks: preflight.yml
  tags: always

- name: Evaluate current AD join health
  ansible.builtin.import_tasks: health_check.yml
  tags: always

- name: Apply PNC auth configuration (sssd / krb5 / authselect / sudoers)
  ansible.builtin.import_tasks: configure_auth.yml
  tags:
    - configure
    - auth_config
    - join
  when: mrg_dual_auth_lifecycle_action != 'leave_ad'

- name: Join server to Active Directory if not already healthily joined
  ansible.builtin.import_tasks: join_ad.yml
  tags: join
  when:
    - mrg_dual_auth_lifecycle_action == 'configure'
    - not (mrg_dual_auth_healthy | default(false)) or mrg_dual_auth_force_configure

- name: Forced leave-and-rejoin
  ansible.builtin.import_tasks: rejoin.yml
  tags: rejoin
  when: mrg_dual_auth_lifecycle_action == 'rejoin'

- name: Full decommission - leave AD and restore pre-join state
  ansible.builtin.import_tasks: leave_ad.yml
  tags: leave_ad
  when: mrg_dual_auth_lifecycle_action == 'leave_ad'
