---
- name: Validate dual_auth_lifecycle_action is a known value
  ansible.builtin.assert:
    that:
      - dual_auth_lifecycle_action in ['configure', 'rejoin', 'leave_ad', 'convert_ad_only', 'recreate_keytab', 'recreate_sssd']
    fail_msg: >-
      dual_auth_lifecycle_action={{ dual_auth_lifecycle_action }} is not
      one of configure/rejoin/leave_ad/convert_ad_only/recreate_keytab/recreate_sssd - check the Survey choice value or -e override.
    success_msg: "dual_auth_lifecycle_action value is valid."

- name: Determine current sssd id_provider configuration
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      cat /etc/sssd/sssd.conf /etc/sssd/conf.d/* 2>/dev/null
      | grep '^id_provider' | cut -d '=' -f2 | tr -d ' ' | paste -sd '+'
  register: dual_auth_current_auth
  changed_when: false
  failed_when: false

- name: Read current AUTHMETHOD from PNC provision config
  ansible.builtin.command: "grep -m1 ^AUTHMETHOD= {{ dual_auth_provision_config_path }}"
  register: dual_auth_authmethod_raw
  changed_when: false
  failed_when: false

- name: Normalize current AUTHMETHOD value
  ansible.builtin.set_fact:
    dual_auth_current_authmethod: "{{ dual_auth_authmethod_raw.stdout.split('=')[1] | default('') | trim }}"

- name: Check whether a krb5 keytab already exists
  ansible.builtin.stat:
    path: /etc/krb5.keytab
  register: dual_auth_krb5_keytab_stat

- name: Check current krb5.conf checksum
  ansible.builtin.stat:
    path: /etc/krb5.conf
    checksum_algorithm: md5
  register: dual_auth_krb5_conf_stat

# The "is krb5.conf safe to overwrite" check lives in health_check.yml, not
# here - it needs to know dual_auth_healthy first (an already-healthy
# host's krb5.conf is *our own* templated output, not the pristine OS
# default, so checking it here against the pristine-default checksum list
# would always wrongly fail). See health_check.yml.

- name: Detect whether host is currently OUD-only (no AD joined yet)
  # Used by configure to decide whether to rename home dirs sa04192 -> sa04192OUD.
  # Detection matches the Midrange Mod report check: id_provider = ldap only.
  ansible.builtin.set_fact:
    dual_auth_is_oud_only: >-
      {{ dual_auth_current_auth.stdout | trim == 'ldap' }}

- name: Detect whether host is on the legacy pure-AD path (no OUD configured)
  ansible.builtin.set_fact:
    dual_auth_is_legacy_ad_only: >-
      {{ 'AD' in (dual_auth_current_auth.stdout | upper) and
         dual_auth_current_authmethod != dual_auth_target_authmethod }}

- name: Warn that this is a legacy pure-AD host - will migrate to OUD+AD
  ansible.builtin.debug:
    msg: >-
      WARNING: sssd reports an AD id_provider but AUTHMETHOD is not OUD+AD.
      This host is on the legacy pure-AD path. The configure action will
      back up the existing sssd.conf, generate a fresh OUD+AD one, and
      deploy the dual auth conf.d files. OUD admin password is required.
  when: dual_auth_is_legacy_ad_only | bool
