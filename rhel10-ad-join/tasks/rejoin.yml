---
# Removes the existing computer account from AD and rejoins cleanly.
# Use when the host shows as joined but broken (corrupt keytab, stale
# machine account password, domain unreachable from sssd).
#
# For OUD+AD hosts: authenticates using the static pre-built .dat keytab.
# For legacy AD-only hosts: passes the bind account password directly to
# adcli via --stdin-password. This avoids the kinit/ccache/GSSAPI path
# entirely, which is unreliable when the ccache is empty or the host has
# a non-standard ccache location (e.g. Hadoop servers).

- name: Get authentication for AD operations (legacy AD-only - password via stdin)
  when: dual_auth_is_legacy_ad_only | default(false) | bool
  block:
    - name: Validate AD bind password is set
      ansible.builtin.assert:
        that:
          - dual_auth_ad_bind_password | length > 0
        fail_msg: >-
          ad_bind_password_{{ dual_auth_target_env }} is empty.
          Required for rejoin on legacy AD-only hosts.
          Set it via the PNC MRG AD Bind AAP credential or -e on CLI.
      no_log: true

    - name: Remove existing computer account from AD
      ansible.builtin.shell: >-
        echo "{{ dual_auth_ad_bind_password }}" |
        timeout 60 adcli delete-computer
        --login-user={{ dual_auth_username }}
        --stdin-password
        --domain={{ dual_auth_domain }}
        {{ ansible_hostname }}
      no_log: true
      register: dual_auth_adcli_delete
      changed_when: true
      failed_when: false

    - name: Remove the existing host keytab before rejoining
      ansible.builtin.file:
        path: /etc/krb5.keytab
        state: absent

    - name: Rejoin AD using bind account password directly
      ansible.builtin.shell: >-
        echo "{{ dual_auth_ad_bind_password }}" |
        timeout 90 adcli join
        --login-user={{ dual_auth_username }}
        --stdin-password
        --service-name=host --service-name=nfs
        --host-fqdn={{ ansible_fqdn }}
        --user-principal=host/{{ ansible_fqdn }}@{{ dual_auth_realm }}
        --domain-ou={{ dual_auth_base_ou }},{{ dual_auth_dc_ou }}
        --domain={{ dual_auth_domain }}
        --show-details -K /etc/krb5.keytab
      no_log: true
      register: dual_auth_adcli_join
      changed_when: true

    - name: Restart sssd-kcm service
      ansible.builtin.systemd_service:
        name: sssd-kcm.service
        state: restarted

    - name: Enable and start sssd
      ansible.builtin.systemd_service:
        name: sssd.service
        enabled: true
        state: started

- name: Get authentication for AD operations (OUD+AD - use static keytab)
  ansible.builtin.import_tasks: stage_static_keytab.yml
  when: not (dual_auth_is_legacy_ad_only | default(false) | bool)

- name: Remove existing computer account from AD (OUD+AD)
  ansible.builtin.command: >-
    timeout 60 adcli delete-computer -C
    --domain={{ dual_auth_domain }} {{ ansible_hostname }}
  register: dual_auth_adcli_delete
  changed_when: true
  failed_when: false
  when: not (dual_auth_is_legacy_ad_only | default(false) | bool)

- name: Clean up transient keytab and ticket cache (OUD+AD)
  ansible.builtin.import_tasks: destroy_transient_keytab.yml
  when: not (dual_auth_is_legacy_ad_only | default(false) | bool)

- name: Remove the existing host keytab before rejoining (OUD+AD)
  ansible.builtin.file:
    path: /etc/krb5.keytab
    state: absent
  when: not (dual_auth_is_legacy_ad_only | default(false) | bool)

- name: Rejoin AD (OUD+AD)
  ansible.builtin.import_tasks: join_ad.yml
  when: not (dual_auth_is_legacy_ad_only | default(false) | bool)
