---
# Manages home directory renames/moves during lifecycle transitions.
# Never chowns anything here except the one explicit CIS-safety exception
# noted below - sssd corrects ownership automatically once the domain is
# joined/left and the kernel resolves UIDs again.
#
# Only touches home dirs owned by UIDs in the OUD/AD managed user range
# (uid > 2000000). Local/system accounts are well below 2M. No upper bound
# is used since OUD UIDs can be in the 700M+ range.
# This is the same UID range check the pnc_join_ad RPM %post used.
#
# IMPORTANT: every shell task below uses the dict form
#   ansible.builtin.shell:
#     cmd: |
#       ...
# instead of the free-form
#   ansible.builtin.shell: |
#     ...
# On purpose. The free-form style is parsed by Ansible's split_args() to
# look for k=v module parameters (chdir=, creates=, etc.) BEFORE the string
# ever reaches bash. That parser tracks quote characters across the whole
# block, and a single stray/unpaired quote anywhere in it - including in a
# comment, e.g. a contraction like "doesn't" or "hasn't" - is read as an
# unterminated quote and blows up the whole task with:
#   "failed at splitting arguments, either an unbalanced jinja2 block or quotes"
# The dict cmd: form is not free-form parsed, so it is not exposed to this
# at all. Keep using cmd: for any new shell/command task in this file.
#
# Every action here is logged to dual_auth_log_lines (see logging_init.yml /
# log_flush.yml, set up once at the top of tasks/main.yml) with a before
# snapshot, a line per directory acted on, and an after snapshot. Flushed to
# /var/log/pnc_dual_auth/<action>_<timestamp>.log at the end of this file.
#
# Callers set dual_auth_homedir_action before importing this file:
#   rename_to_oud   - configure on OUD-only host migrating to OUD+AD
#   move_ad_into_oud - leave_ad when both *OUD and AD dirs exist
#   move_oud_into_ad - convert_ad_only

# ── configure: OUD-only host migrating to OUD+AD ─────────────────────────────
# Rename /home/sa04192 → /home/sa04192OUD so the AD home dir path is free.
# Guard: skip if /home/sa04192OUD already exists.
- name: Rename OUD home dirs to *OUD (configure on OUD-only host)
  when: dual_auth_homedir_action == 'rename_to_oud'
  block:
    - name: Log start of rename_to_oud
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          '--- homedirs: rename_to_oud ---'] }}"

    - name: Find candidate home dirs (no OUD suffix)
      ansible.builtin.shell:
        cmd: |
          for dir in /home/*/; do
            dir="${dir%/}"
            name=$(basename "$dir")
            # skip dirs that already end in OUD or OUD.date
            echo "$name" | grep -qE 'OUD($|\.)' && continue
            uid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $3}')
            [ -z "$uid" ] && continue
            if [ "$uid" -gt 2000000 ]; then
              echo "$dir"
            fi
          done
      register: dual_auth_homedir_candidates
      changed_when: false

    - name: Log BEFORE candidates found
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          'BEFORE - candidates with no OUD suffix (uid > 2000000):']
          + (dual_auth_homedir_candidates.stdout_lines if dual_auth_homedir_candidates.stdout_lines | length > 0 else ['(none found)'])
          + [''] }}"

    - name: Rename each candidate to *OUD if *OUD does not already exist
      ansible.builtin.shell:
        cmd: |
          src="{{ item }}"
          dst="{{ item }}OUD"
          if [ -d "$src" ] && [ ! -d "$dst" ]; then
            mv "$src" "$dst"
            echo "moved"
          else
            echo "skipped"
          fi
      loop: "{{ dual_auth_homedir_candidates.stdout_lines }}"
      register: dual_auth_rename_result
      changed_when: "'moved' in dual_auth_rename_result.stdout"

    - name: Log rename actions
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + ['ACTIONS:']
          + (dual_auth_rename_result.results | map(attribute='item') | zip(dual_auth_rename_result.results | map(attribute='stdout'))
             | map('join', ' -> renamed to *OUD: ') | list
             if dual_auth_rename_result.results | default([]) | length > 0 else ['(nothing to rename)'])
          + [''] }}"

    - name: Flush log after rename_to_oud
      ansible.builtin.import_tasks: log_flush.yml

# ── leave_ad: both *OUD and AD dir exist ─────────────────────────────────────
# Move AD home dir inside the OUD dir as *OUD/sa04192AD.
# If only the AD dir exists (no *OUD counterpart), leave it — it goes numeric
# and sssd corrects ownership when AD is rejoined via configure or rejoin.
- name: Move AD home dirs inside existing OUD dirs (leave_ad)
  when: dual_auth_homedir_action == 'move_ad_into_oud'
  block:
    - name: Log start of move_ad_into_oud
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          '--- homedirs: move_ad_into_oud ---'] }}"

    - name: Find AD home dirs that have a matching *OUD counterpart
      ansible.builtin.shell:
        cmd: |
          for dir in /home/*/; do
            dir="${dir%/}"
            name=$(basename "$dir")
            echo "$name" | grep -qE 'OUD($|\.)' && continue
            uid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $3}')
            [ -z "$uid" ] && continue
            if [ "$uid" -gt 2000000 ]; then
              if [ -d "${dir}OUD" ]; then
                echo "$dir"
              fi
            fi
          done
      register: dual_auth_ad_to_move
      changed_when: false

    - name: Log BEFORE AD dirs with an OUD counterpart
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          'BEFORE - AD dirs with a matching *OUD counterpart:']
          + (dual_auth_ad_to_move.stdout_lines if dual_auth_ad_to_move.stdout_lines | length > 0 else ['(none found)'])
          + [''] }}"

    - name: Move AD dir inside OUD dir as *OUD/basenameAD
      ansible.builtin.shell:
        cmd: |
          src="{{ item }}"
          name=$(basename "$src")
          dst="${src}OUD/${name}AD"
          if [ -d "$src" ]; then
            mv "$src" "$dst"
            echo "moved"
          else
            echo "skipped"
          fi
      loop: "{{ dual_auth_ad_to_move.stdout_lines }}"
      register: dual_auth_move_ad_result
      changed_when: "'moved' in dual_auth_move_ad_result.stdout"

    - name: Log move_ad_into_oud actions
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + ['ACTIONS:']
          + (dual_auth_move_ad_result.results | map(attribute='item') | zip(dual_auth_move_ad_result.results | map(attribute='stdout'))
             | map('join', ' -> moved inside *OUD dir: ') | list
             if dual_auth_move_ad_result.results | default([]) | length > 0 else ['(nothing to move)'])
          + [''] }}"

    - name: Flush log after move_ad_into_oud
      ansible.builtin.import_tasks: log_flush.yml

# ── convert_ad_only: move *OUD dir inside AD dir ─────────────────────────────
# Move /home/sa04192OUD inside /home/sa04192 as sa04192/sa04192OUD for backup.
# Ownership will be corrected by sssd (AD user) naturally.
- name: Move OUD dirs inside AD dirs (convert_ad_only)
  when: dual_auth_homedir_action == 'move_oud_into_ad'
  block:
    - name: Log start of move_oud_into_ad
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          '--- homedirs: move_oud_into_ad ---'] }}"

    - name: Snapshot *OUD home dirs before any action
      ansible.builtin.shell:
        cmd: |
          for dir in /home/*OUD/; do
            dir="${dir%/}"
            [ ! -d "$dir" ] && continue
            uid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $3}')
            gid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $4}')
            [ -z "$uid" ] && continue
            if [ "$uid" -gt 2000000 ]; then
              echo "$uid $gid $dir"
            fi
          done
      register: dual_auth_oud_before_snapshot
      changed_when: false

    - name: Log BEFORE snapshot
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          'BEFORE (managed *OUD home dirs, uid > 2000000):']
          + (dual_auth_oud_before_snapshot.stdout_lines if dual_auth_oud_before_snapshot.stdout_lines | length > 0 else ['(none found)'])
          + [''] }}"

    - name: Chown OUD dirs without AD counterpart to root:root
      # OUD dirs whose AD home dir does not exist yet (user never logged in
      # via AD) are left in place but chowned to root:root to prevent CIS
      # findings for unowned numeric UIDs. sssd cannot resolve OUD UIDs after
      # OUD is removed.
      ansible.builtin.shell:
        cmd: |
          for dir in /home/*OUD/; do
            dir="${dir%/}"
            [ ! -d "$dir" ] && continue
            addir="${dir%OUD}"
            uid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $3}')
            [ -z "$uid" ] && continue
            if [ "$uid" -gt 2000000 ] && [ ! -d "$addir" ]; then
              chown -R root:root "$dir"
              echo "no-ad-counterpart: $dir ($addir absent) -> chowned to root:root"
            fi
          done
      register: dual_auth_chown_root_result
      changed_when: true
      failed_when: false

    - name: Find *OUD dirs that have a matching AD counterpart
      ansible.builtin.shell:
        cmd: |
          for dir in /home/*OUD/; do
            dir="${dir%/}"
            [ ! -d "$dir" ] && continue
            name=$(basename "$dir")
            addir="${dir%OUD}"
            uid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $3}')
            [ -z "$uid" ] && continue
            if [ "$uid" -gt 2000000 ]; then
              if [ -d "$addir" ]; then
                echo "$dir"
              fi
            fi
          done
      register: dual_auth_oud_to_move
      changed_when: false

    - name: Log chown-to-root and ad-match-found actions
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + ['ACTIONS:']
          + (dual_auth_chown_root_result.stdout_lines if dual_auth_chown_root_result.stdout_lines | length > 0 else [])
          + (dual_auth_oud_to_move.stdout_lines | map('regex_replace', '^(.*)$', 'ad-match-found: \\1 -> queued for move') | list) }}"

    - name: Move OUD dir inside AD dir and chown to AD user
      # Uses a timestamp-suffixed destination if a backup from a PRIOR
      # conversion already occupies the plain path (e.g. /home/sa04910/sa04910OUD
      # already exists from an earlier convert_ad_only run). Without this,
      # repeated OUD-login -> convert_ad_only cycles for the same user collide
      # on the exact same destination every time. `mv` can refuse a collision
      # even when the existing directory LOOKS empty via `ls` - pam_mkhomedir
      # populates new home dirs from /etc/skel, and plain `ls` hides dotfiles
      # like .bash_profile/.bashrc, so a dir that looks empty in a listing can
      # still be non-empty to mv's rename() and get rejected with
      # "Directory not empty". The exit status is checked explicitly below so
      # a failure is never mistaken for success.
      ansible.builtin.shell:
        cmd: |
          src="{{ item }}"
          name=$(basename "$src")
          addir="${src%OUD}"
          dst="${addir}/${name}"
          username=$(basename "$addir")
          if [ -d "$dst" ]; then
            # Prior backup already at the plain path - suffix with a
            # timestamp so we never collide with or clobber earlier history.
            dst="${dst}.$(date -u +%Y%m%d-%H%M%S)"
          fi
          if [ -d "$src" ]; then
            mv_err=$(mv "$src" "$dst" 2>&1)
            mv_rc=$?
            if [ "$mv_rc" -ne 0 ]; then
              echo "FAILED to move to $dst (mv exit $mv_rc): $mv_err"
            else
              # Resolve AD UID/GID via sssd. Falls back gracefully if sssd has
              # not fully settled yet - ownership can be corrected manually.
              uid=$(id -u "$username" 2>/dev/null)
              gid=$(id -g "$username" 2>/dev/null)
              if [ -n "$uid" ] && [ "$uid" -gt 0 ]; then
                chown -R "$uid:$gid" "$dst"
                echo "moved to $dst, chowned to $uid:$gid"
              else
                echo "moved to $dst, chown skipped ($username not resolvable via sssd)"
              fi
            fi
          else
            echo "skipped ($src no longer present)"
          fi
      loop: "{{ dual_auth_oud_to_move.stdout_lines }}"
      register: dual_auth_move_oud_result
      changed_when: "'moved' in dual_auth_move_oud_result.stdout"

    - name: Log move actions
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines
          + (dual_auth_move_oud_result.results | map(attribute='item') | zip(dual_auth_move_oud_result.results | map(attribute='stdout'))
             | map('join', ' -> ') | list
             if dual_auth_move_oud_result.results | default([]) | length > 0 else [])
          + [''] }}"

    - name: Snapshot *OUD home dirs after all actions
      ansible.builtin.shell:
        cmd: |
          for dir in $(find /home -maxdepth 2 -type d -name '*OUD' 2>/dev/null); do
            uid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $3}')
            gid=$(ls -ldn "$dir" 2>/dev/null | awk '{print $4}')
            [ -z "$uid" ] && continue
            if [ "$uid" -gt 2000000 ] || [ "$uid" = "0" ]; then
              echo "$uid $gid $dir"
            fi
          done
      register: dual_auth_oud_after_snapshot
      changed_when: false

    - name: Log AFTER snapshot and summary
      ansible.builtin.set_fact:
        dual_auth_log_lines: "{{ dual_auth_log_lines + [
          'AFTER (same dirs, post-run - includes any now nested under an AD dir):']
          + (dual_auth_oud_after_snapshot.stdout_lines if dual_auth_oud_after_snapshot.stdout_lines | length > 0 else ['(none found)'])
          + ['',
             'SUMMARY:',
             'chowned to root:root : ' ~ (dual_auth_chown_root_result.stdout_lines | length),
             'moved to AD dir       : ' ~ (dual_auth_move_oud_result.results | default([]) | selectattr('stdout', 'search', '^moved') | list | length),
             'FAILED to move        : ' ~ (dual_auth_move_oud_result.results | default([]) | selectattr('stdout', 'search', '^FAILED') | list | length),
             ''] }}"

    - name: Flush log after move_oud_into_ad
      ansible.builtin.import_tasks: log_flush.yml
