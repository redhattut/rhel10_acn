---
# Only runs with an explicit `--tags leave_ad`. Mirrors the original RPMs'
# %preun/%postun behaviour: leave AD, restore the pre-join backups, and put
# the host back into an OUD-only state.

- name: Stop and disable sssd before decommissioning AD join
  ansible.builtin.systemd_service:
    name: sssd.service
    state: stopped
    enabled: false

- name: Stage the static AD bind-account keytab and obtain TGT for removal
  ansible.builtin.import_tasks: stage_static_keytab.yml
  when: dual_auth_krb5_keytab_stat.stat.exists | default(false)

- name: Remove computer account from Active Directory
  ansible.builtin.command: "timeout 60 adcli delete-computer -C --domain={{ dual_auth_domain }} {{ ansible_hostname }}"
  register: dual_auth_adcli_delete
  changed_when: true
  failed_when: false
  when: dual_auth_krb5_keytab_stat.stat.exists | default(false)

- name: Clean up transient keytab and ticket cache after removal
  ansible.builtin.import_tasks: destroy_transient_keytab.yml
  when: dual_auth_krb5_keytab_stat.stat.exists | default(false)

- name: Check existence of backup files to restore
  ansible.builtin.stat:
    path: "{{ dual_auth_auth_backup_dir }}/{{ item | basename }}.pnc_auth_config"
  register: dual_auth_restore_candidates
  loop:
    - /etc/nsswitch.conf
    - /etc/disable.passwd
    - /etc/sssd/sssd.conf
    - /etc/krb5.conf
    - /etc/security/login-access.conf
  loop_control:
    label: "{{ item }}"

- name: Restore backed-up configuration files
  ansible.builtin.copy:
    src: "{{ dual_auth_auth_backup_dir }}/{{ item.item | basename }}.pnc_auth_config"
    dest: "{{ item.item }}"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  loop: "{{ dual_auth_restore_candidates.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Remove the Kerberos keytab
  ansible.builtin.file:
    path: /etc/krb5.keytab
    state: absent

- name: Remove /etc/krb5.conf deployed by this role
  ansible.builtin.file:
    path: /etc/krb5.conf
    state: absent

- name: Remove AD-specific sssd conf.d fragments
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sssd/conf.d/60-pnc-OUD-AD.conf
    - /etc/sssd/conf.d/50-pncad.conf
    - /etc/sssd/conf.d/40-pncbank.conf
    - /etc/sssd/conf.d/55-pncad.conf

- name: Remove krb5 localauth plugin include
  ansible.builtin.file:
    path: /etc/krb5.conf.d/enable_sssd_conf_dir
    state: absent

- name: Clear sssd caches
  ansible.builtin.shell:
    cmd: >-
      rm -rf /var/lib/sss/db/* /var/lib/sss/mc/* /var/lib/sss/pubconf/kdcinfo.*
  changed_when: true

- name: Refresh sss_cache
  ansible.builtin.command: sss_cache -E
  changed_when: true

- name: Move AD home dirs inside existing OUD dirs where both exist (leave_ad)
  # When both /home/sa04192 and /home/sa04192OUD exist, moves the AD dir
  # contents inside the OUD dir as /home/sa04192OUD/sa04192AD.
  # When only the AD dir exists (no OUD counterpart), leaves it as-is -
  # it goes to numeric IDs and sssd corrects ownership on next configure/rejoin.
  ansible.builtin.include_tasks: manage_homedirs.yml
  vars:
    dual_auth_homedir_action: move_ad_into_oud

- name: Remove AUTHMETHOD line from PNC provision config
  ansible.builtin.lineinfile:
    path: "{{ dual_auth_provision_config_path }}"
    regexp: '^AUTHMETHOD='
    state: absent

- name: Re-enable and start sssd (post decommission, OUD-only)
  ansible.builtin.systemd_service:
    name: sssd.service
    enabled: true
    state: started
