---
# Rebuilds /etc/krb5.keytab (the machine account HOST keytab used by sssd)
# by passing the bind account password directly to adcli join, which updates
# or recreates the computer account and writes the correct host/fqdn@REALM
# keytab to /etc/krb5.keytab.
#
# Uses adcli's --stdin-password instead of kinit/ccache to avoid GSSAPI
# SPNEGO negotiation failures that occur on hosts with non-standard ccache
# configurations (e.g. Hadoop servers with default_ccache_name set).
#
# Requires: ad_bind_password_<env> via PNC MRG AD Bind AAP credential
#           or -e ad_bind_password_<env>=<value> on CLI.

- name: Validate AD bind password is set for this environment
  ansible.builtin.assert:
    that:
      - dual_auth_ad_bind_password | length > 0
    fail_msg: >-
      ad_bind_password_{{ dual_auth_target_env }} is empty.
      Set it via the PNC MRG AD Bind AAP credential or -e on CLI.
  no_log: true

- name: Update computer account and write HOST keytab via adcli join
  ansible.builtin.shell: >-
    echo "{{ dual_auth_ad_bind_password }}" |
    timeout 90 adcli join
    --login-user={{ dual_auth_username }}
    --stdin-password
    --service-name=host --service-name=nfs
    --host-fqdn={{ ansible_fqdn }}
    --user-principal=host/{{ ansible_fqdn }}@{{ dual_auth_realm }}
    --domain-ou={{ dual_auth_base_ou }},{{ dual_auth_dc_ou }}
    --domain={{ dual_auth_domain }}
    --show-details -K /etc/krb5.keytab
  no_log: true
  register: dual_auth_adcli_join
  changed_when: true

- name: Verify HOST keytab was written correctly
  ansible.builtin.command: >-
    klist -k /etc/krb5.keytab
  changed_when: false
  register: dual_auth_keytab_verify
  failed_when: dual_auth_keytab_verify.rc != 0

- name: Show keytab principals written
  ansible.builtin.debug:
    msg: "{{ dual_auth_keytab_verify.stdout_lines }}"

- name: Restart sssd to pick up the refreshed keytab
  ansible.builtin.systemd:
    name: sssd
    state: restarted
