---
# Handles /etc/sssd/sssd.conf for two cases:
#
# 1. EXISTING host (sssd.conf already present from a prior OUD or pnc_auth_config
#    setup): rename [domain/default] -> [domain/OUD] and domains=default -> OUD
#    in-place. This is idempotent - if already renamed, the regex matches nothing.
#
# 2. NEW BUILD (sssd.conf absent): generate from scratch using sssd.conf.j2,
#    which includes the OUD LDAP hostId bind DN and password. This requires:
#    - Creating/updating the host bind account in OUD LDAP directly on the
#      target host via ldapmodify (openldap-clients is installed if needed).
#      Target hosts already have network access to the OUD LDAP servers since
#      they are OUD clients. This replicates what amm-create-authn did on the
#      jumpbox, but runs directly on the target - no jumpbox dependency.
#    - dual_auth_oud_admin_password_<env> set via AAP credential or -e on CLI

- name: Check whether /etc/sssd/sssd.conf already exists
  ansible.builtin.stat:
    path: /etc/sssd/sssd.conf
  register: dual_auth_sssd_conf_stat

# ── Legacy pure-AD host path ──────────────────────────────────────────────────
# If this host was previously AD-only (no OUD), sssd.conf has no [domain/OUD]
# section at all. Back it up and remove it so the new-build generation path
# below creates a proper OUD+AD sssd.conf from the template.
- name: Handle legacy pure-AD host - back up and remove AD-only sssd.conf
  when:
    - dual_auth_sssd_conf_stat.stat.exists
    - dual_auth_is_legacy_ad_only | default(false) | bool
  block:
    - name: Back up existing AD-only sssd.conf before OUD+AD migration
      ansible.builtin.copy:
        src: /etc/sssd/sssd.conf
        dest: "{{ dual_auth_auth_backup_dir }}/sssd.conf.pre_oud_migration"
        remote_src: true
        mode: "0600"

    - name: Remove AD-only sssd.conf to trigger fresh OUD+AD generation
      ansible.builtin.file:
        path: /etc/sssd/sssd.conf
        state: absent

    - name: Re-stat sssd.conf after removal
      ansible.builtin.stat:
        path: /etc/sssd/sssd.conf
      register: dual_auth_sssd_conf_stat

# ── Existing OUD host path (in-place rename) ──────────────────────────────────
- name: Rename legacy [domain/default] stanza to [domain/OUD] in existing sssd.conf
  ansible.builtin.replace:
    path: /etc/sssd/sssd.conf
    regexp: '^\[domain/default\]'
    replace: '[domain/OUD]'
  when: dual_auth_sssd_conf_stat.stat.exists

- name: Rename bare "default" domain reference to "OUD" in existing sssd.conf
  ansible.builtin.replace:
    path: /etc/sssd/sssd.conf
    regexp: '(domains\s*=.*?)\bdefault\b'
    replace: '\1OUD'
  when: dual_auth_sssd_conf_stat.stat.exists

# ── New build path (generate from scratch) ───────────────────────────────────
- name: Generate sssd.conf from scratch for new build
  when: not dual_auth_sssd_conf_stat.stat.exists
  block:
    - name: Validate OUD admin password is set for this environment
      ansible.builtin.assert:
        that:
          - dual_auth_oud_admin_password | length > 0
        fail_msg: >-
          dual_auth_oud_admin_password_{{ dual_auth_target_env }} is empty.
          Set it via AAP Survey (Password type) or -e on CLI.

    - name: Generate random host bind password
      ansible.builtin.shell: |
        head /dev/urandom | md5sum | base64 | head -c 16
      register: dual_auth_host_pwd_result
      changed_when: false
      no_log: true

    - name: Set host bind credential facts
      ansible.builtin.set_fact:
        dual_auth_host_cn: "{{ ansible_hostname }}-hostid"
        dual_auth_host_dn: "cn={{ ansible_hostname }}-hostid,ou=amm,ou=TrustedApplications,ou=FrameworkSystems,o=pnc"
        dual_auth_host_pwd: "{{ dual_auth_host_pwd_result.stdout }}"
      no_log: true

    - name: Ensure openldap-clients is installed for ldapmodify
      ansible.builtin.package:
        name: openldap-clients
        state: present

    - name: Render hostId LDIF to temp file on target host
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../files/hostid.ldif.j2"
        dest: "/tmp/{{ ansible_hostname }}.ldif"
        mode: "0600"
      no_log: true

    - name: Check if OUD hostId account already exists
      ansible.builtin.shell: >-
        ldapsearch -LLL
        -H "{{ dual_auth_oud_ldap_uri }}"
        -x -D "{{ dual_auth_oud_admin_dn }}"
        -w "{{ dual_auth_oud_admin_password }}"
        -b "ou=TrustedApplications,ou=FrameworkSystems,o=pnc"
        "cn={{ dual_auth_host_cn }}" dn
        | grep -q "^dn:"
      register: dual_auth_oud_hostid_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Create OUD hostId account (does not exist yet)
      ansible.builtin.command: >-
        ldapmodify
        -H "{{ dual_auth_oud_ldap_uri }}"
        -x -D "{{ dual_auth_oud_admin_dn }}"
        -w "{{ dual_auth_oud_admin_password }}"
        -c -f /tmp/{{ ansible_hostname }}.ldif
      no_log: true
      when: dual_auth_oud_hostid_check.rc != 0

    - name: Update OUD hostId account password (account already exists)
      ansible.builtin.shell: |
        ldapmodify \
          -H "{{ dual_auth_oud_ldap_uri }}" \
          -x -D "{{ dual_auth_oud_admin_dn }}" \
          -w "{{ dual_auth_oud_admin_password }}" << EOLDIFF
        dn: {{ dual_auth_host_dn }}
        changetype: modify
        replace: userPassword
        userPassword: {{ dual_auth_host_pwd }}
        EOLDIFF
      no_log: true
      when: dual_auth_oud_hostid_check.rc == 0

    - name: Remove temp LDIF from target host
      ansible.builtin.file:
        path: "/tmp/{{ ansible_hostname }}.ldif"
        state: absent

    - name: Deploy sssd.conf from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../files/sssd.conf.j2"
        dest: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
