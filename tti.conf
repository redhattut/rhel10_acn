# =============================================================================
# tti.conf — Central configuration for TTI EAR termination/transfer process
# =============================================================================
# All scripts source this file at startup.
# Edit here — changes propagate to every script automatically.
# =============================================================================

# --- Base directories --------------------------------------------------------
BASE_DIR="/export/home/xamrgpti"
SCRIPTS_DIR="${BASE_DIR}/scripts"
DATA_DIR="${BASE_DIR}/data"
LOGS_DIR="${BASE_DIR}/logs"

# --- Data subdirectories -----------------------------------------------------
IDS_DIR="${DATA_DIR}/ids"              # timestamped ID snapshots per run
TERMS_ARCHIVE_DIR="${DATA_DIR}/terms"  # raw OIM terms files from server
TRANS_ARCHIVE_DIR="${DATA_DIR}/trans"  # raw OIM trans files from server

# --- OIM source server -------------------------------------------------------
# Both terms and trans files live in the same directory on the OIM server.
# All four file types produced by OIM each run live under OIM_EAR_DIR:
#
#   terms.YYYYMMDDHHMMSS      — raw tilde-delimited full data (archived locally)
#   terms.id.YYYYMMDDHHMMSS   — pre-extracted ID list, one uppercase ID per line
#   trans.YYYYMMDDHHMMSS      — raw tilde-delimited full data (archived locally)
#   trans.id.YYYYMMDDHHMMSS   — pre-extracted ID list, one uppercase ID per line
#
# getdata.sh SCPs both file types per kind.
#   - Raw file  -> archived to data/terms/ or data/trans/
#   - .id. file -> lowercased, written as data/terms.ids or data/trans.ids
#
# Only one directory variable is needed since terms and trans share the same path.
OIM_HOST="loim375a"
OIM_EAR_DIR="/app/OIM/AppSupport/EAR"

# --- Target server list ------------------------------------------------------
# One hostname per line. Used for all cleanup operations.
SERVER_LIST="/usr/local/bin/hosts.linux.nonfed.txt"

# --- Parallel SSH (pssh) settings --------------------------------------------
# PSSH_BIN: /usr/bin/pssh on most RHEL/Rocky systems
# PSSH_BATCH: hosts processed in parallel per invocation
# PSSH_TIMEOUT: per-host timeout in seconds
# PSSH_BIN: full path to pssh binary — /usr/local/pssh/bin/pssh on this system
# PSSH_LOGIN: remote user to connect as
# PSSH_OPTS: base options passed to every pssh invocation
#   -I             read script from stdin (avoids all command-line quoting issues)
#   --inline-stdout  prefix each host output line with [N] host: for parsing
#   -p BATCH       parallel host count
#   -t TIMEOUT     per-host timeout in seconds
PSSH_BATCH=75
PSSH_TIMEOUT=30
PSSH_BIN="/usr/local/pssh/bin/pssh"
PSSH_LOGIN="root"
PSSH_OPTS="-I --inline-stdout -p ${PSSH_BATCH} -t ${PSSH_TIMEOUT} -l ${PSSH_LOGIN}"

# Standard single-host SSH options (used in getdata.sh for OIM SCP only)
SSH_OPTS="-q -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o BatchMode=yes"

# --- Notification ------------------------------------------------------------
NOTIFY="ttinotify"

# --- Lock file ---------------------------------------------------------------
# Prevents concurrent runs. Cleared by trap on all exit paths.
LOCK_FILE="/var/tmp/EARlock.lck"

# --- Log files ---------------------------------------------------------------
# MAIN_LOG   : append-only master log — full history of every run
# LOG_GETDATA: getdata.sh working log (truncated each run)
# LOG_CLEANUP: cleanup_homes.sh working log (truncated each run)
# LOG_PASSWD : cleanup_passwd_group.sh working log (truncated each run)
# LOG_HOSTS  : unreachable hosts log (truncated each run, archived as linux.STAMP)
#
# Archived per-run logs land in LOGS_DIR (live) or DRYRUN_LOGS_DIR (dry-run):
#   linuxterms.YYMMDDHHMM    home cleanup for terminations
#   linuxtrans.YYMMDDHHMM    home cleanup for transfers
#   linuxfiles.YYMMDDHHMM    passwd/group cleanup
#   linux.YYMMDDHHMM         unreachable hosts
#
# Dry-run archived logs use the naming convention:
#   dryrun-N-YYMMDDHHMM      where N is an auto-incrementing run number
MAIN_LOG="${LOGS_DIR}/tti_process.log"
LOG_GETDATA="${LOGS_DIR}/tti_getdata.log"
LOG_CLEANUP="${LOGS_DIR}/tti_cleanup.log"
LOG_PASSWD="${LOGS_DIR}/tti_passwd_group.log"
LOG_HOSTS="${LOGS_DIR}/tti_unreachable.log"

# Dry-run logs go to a dedicated subdirectory so they never mix with live logs
DRYRUN_LOGS_DIR="${LOGS_DIR}/dryrun"

# --- Home directory patterns -------------------------------------------------
# AD-style:  /home/<userid>       (e.g. /home/pn15145)
# OUD-style: /home/<useridOUD>    (e.g. /home/pn15145OUD)
AD_HOME_PATTERN="/home/%s"
OUD_HOME_PATTERN="/home/%sOUD"

# --- Retention (days) — enforced by nightly cron find/rm jobs ----------------
TERMS_RETAIN_DAYS=365
TRANS_RETAIN_DAYS=365
LOG_RETAIN_DAYS=365
IDS_RETAIN_DAYS=730
DRYRUN_RETAIN_DAYS=90
